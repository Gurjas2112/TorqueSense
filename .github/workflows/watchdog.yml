# watchdog.yml — hourly: keeps the free Supabase project from pausing, and fails (GitHub emails the
# owner) when the station is expected online but has not reported for 30 minutes.
# Repository variables: SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY (public by design), TS_EXPECT_ONLINE.
name: watchdog
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/watchdog.py
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          TS_EXPECT_ONLINE: ${{ vars.TS_EXPECT_ONLINE }}

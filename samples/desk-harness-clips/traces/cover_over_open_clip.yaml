# Clip 2 left open and covered: the cover hides the defect, so it is flagged the moment the cover arrives.
trace: cover_over_open_clip
events:                # t: ms from cycle start · ip+state: a committed state · tag+value: a plant signal
  - {t: 2000, ip: clip-1, state: closed}
  - {t: 3500, ip: clip-3, state: closed}
  - {t: 5000, ip: clip-4, state: closed}
  - {t: 6500, ip: clip-5, state: closed}
  - {t: 12000, ip: connector-1, state: mated}
  - {t: 20000, ip: cover-1, state: installed}
release_at: 25000
expect:
  release_ok: false
  violations:
    - {kind: PRECEDENCE, step: cover, ip: cover-1, before: [clips]}
    - {kind: INCOMPLETE_AT_RELEASE, step: clips, missing: [clip-2]}

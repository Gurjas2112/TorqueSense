# Screw 4 never fitted; the label went on anyway.
trace: screw_left_out
events:                # t: ms from cycle start · ip+state: a committed state · tag+value: a plant signal
  - {t: 2000, ip: lid-1, state: placed}
  - {t: 4000, ip: screw-1, state: seated}
  - {t: 5000, ip: screw-2, state: seated}
  - {t: 6000, ip: screw-3, state: seated}
  - {t: 10000, ip: screw-1, state: fastened}
  - {t: 13000, ip: screw-3, state: fastened}
  - {t: 16000, ip: screw-2, state: fastened}
  - {t: 25000, ip: label-1, state: applied}
  - {t: 70000, tick: true}
release_at: 71000
expect:
  release_ok: false
  violations:
    - {kind: PRECEDENCE, step: label, ip: label-1, before: [screws]}
    - {kind: STEP_TIMEOUT, step: screws, missing: [screw-4]}
    - {kind: INCOMPLETE_AT_RELEASE, step: screws, missing: [screw-4]}

# Windshield: gasket seated before the glass — PS4 example
# Procedure-level sample: traces only.
profile: windshield-bond
title: "Windshield: gasket seated before the glass — PS4 example"
geometry: cad                 # cad: positions from the STEP file | measured: with a ruler
registration: fixed

cameras:
  - {id: cam-1, width_px: 1920, hfov_deg: 60, position_mm: [-350, -200, 800], look_at_mm: [-350, -200, 0]}
  - {id: cam-2, width_px: 1920, hfov_deg: 60, position_mm: [350, -200, 800], look_at_mm: [350, -200, 0]}
  - {id: cam-3, width_px: 1920, hfov_deg: 60, position_mm: [-350, 200, 800], look_at_mm: [-350, 200, 0]}
  - {id: cam-4, width_px: 1920, hfov_deg: 60, position_mm: [350, 200, 800], look_at_mm: [350, 200, 0]}
sources:                      # one per camera: file | uvc | stream
  cam-1: {kind: file, path: media/cam-1.mp4}
  cam-2: {kind: file, path: media/cam-2.mp4}
  cam-3: {kind: file, path: media/cam-3.mp4}
  cam-4: {kind: file, path: media/cam-4.mp4}

groups:
  - id: gasket
    family: seal_segment
    states: [unseated, seated]
    feature_mm: 10
    members:
      - {position_mm: [-700, -400, 0]}
      - {position_mm: [0, -400, 0]}
      - {position_mm: [700, -400, 0]}
      - {position_mm: [700, 0, 0]}
      - {position_mm: [700, 400, 0]}
      - {position_mm: [0, 400, 0]}
      - {position_mm: [-700, 400, 0]}
      - {position_mm: [-700, 0, 0]}
  - id: glass
    family: panel
    states: [absent, placed]
    feature_mm: 200
    members:
      - {position_mm: [0, 0, 0]}

steps:
  - {id: gasket, group: gasket, kind: complete, state: seated, max_duration_s: 60}
  - {id: glass, group: glass, kind: complete, state: placed, requires: [gasket], max_duration_s: 45}

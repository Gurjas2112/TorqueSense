# recordings/test.mp4 — the right earbud is never inserted; the lid is closed over its empty slot
trace: right_earbud_left_out
events:
  - {t: 500, ip: kit-1, state: present}
  - {t: 500, ip: kit-2, state: present}
  - {t: 500, ip: kit-3, state: present}
  - {t: 500, ip: kit-4, state: present}
  - {t: 800, ip: lid-1, state: open}
  - {t: 2000, ip: left_slot-1, state: seated}
  - {t: 3000, ip: lid-1, state: closed}
  - {t: 4500, ip: cable-1, state: mated}
release_at: 16000
expect:
  release_ok: false
  violations:
    - {kind: PRECEDENCE, step: close_case, ip: lid-1, before: [insert_right]}   # caught as the lid closes, at 3.0 s
    - {kind: STEP_TIMEOUT, step: insert_right, missing: [right_slot-1]}
    - {kind: INCOMPLETE_AT_RELEASE, step: insert_right, missing: [right_slot-1]}

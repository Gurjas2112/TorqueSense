# Jenkins for the GPU gates (spec Sections 26, 31). CI mode only: `docker compose -f docker-compose.jenkins.yml
# --profile ci up -d --build`, with the platform stopped. The controller's plugins and configuration are
# code (docker/jenkins/); its two secrets come from var/jenkins.env, which never enters git.
services:
  jenkins:
    build: docker/jenkins
    image: torquesense/jenkins:lts-jdk21
    profiles: ["ci"]                       # not started by a plain `docker compose up`
    ports: ["127.0.0.1:8081:8080"]         # 8080 is the engine's WebSocket; localhost only
    env_file: [var/jenkins.env]            # JENKINS_ADMIN_PASSWORD, TORQUESENSE_API_KEY
    volumes: ["jenkins-home:/var/jenkins_home"]
    mem_limit: 1g
volumes: { jenkins-home: {} }

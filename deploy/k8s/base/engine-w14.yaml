# One Deployment per station. Recreate, never RollingUpdate: a rolling update starts the
# new pod while the old one still holds the camera and the GPU, so the two fight over
# exclusive hardware. A station is briefly AMBER during a redeploy, which is honest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine-w14
  labels: { app.kubernetes.io/name: engine, torquesense.io/station: w-14 }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: engine, torquesense.io/station: w-14 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: engine, torquesense.io/station: w-14 }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: engine
          image: torquesense/engine:ci
          args: ["--config", "/etc/torquesense/station.yaml"]
          ports:
            - { name: ws, containerPort: 8080 }
            - { name: control, containerPort: 8095 }
          env:
            - name: API_KEY
              valueFrom: { secretKeyRef: { name: torquesense-secrets, key: API_KEY } }
          readinessProbe:
            httpGet: { path: /health, port: control }
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /health, port: control }
            initialDelaySeconds: 20     # covers ONNX warm-up
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: "2", memory: 512Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: config, mountPath: /etc/torquesense, readOnly: true }
      volumes:
        - name: config
          configMap: { name: station-w14 }
---
apiVersion: v1
kind: Service
metadata:
  name: engine-w14
spec:
  selector: { app.kubernetes.io/name: engine, torquesense.io/station: w-14 }
  ports:
    - { name: control, port: 8095, targetPort: control }

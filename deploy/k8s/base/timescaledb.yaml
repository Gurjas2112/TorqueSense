apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: timescaledb
  labels: { app.kubernetes.io/name: timescaledb }
spec:
  serviceName: timescaledb
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: timescaledb }
  template:
    metadata:
      labels: { app.kubernetes.io/name: timescaledb }
    spec:
      containers:
        - name: db
          image: timescale/timescaledb:2.17.2-pg17
          ports: [{ name: pg, containerPort: 5432 }]
          envFrom: [{ secretRef: { name: torquesense-secrets } }]
          env:
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\""] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: timescaledb
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: timescaledb }
  ports: [{ name: pg, port: 5432, targetPort: pg }]

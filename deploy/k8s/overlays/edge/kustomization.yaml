apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - dcgm-local.yaml
patches:
  - path: engine-gpu.yaml
  - path: agent-gpu.yaml
images:
  - { name: torquesense/engine,      newName: registry.plant.local/torquesense/engine,      newTag: "1.4.0" }
  - { name: torquesense/fleet-agent, newName: registry.plant.local/torquesense/fleet-agent, newTag: "1.4.0" }
  - { name: torquesense/api,         newName: registry.plant.local/torquesense/api,         newTag: "1.4.0" }
